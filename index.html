<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Medical Record</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: one phone-width column, five-slot tab bar with a central "Log" button. Calm teal on cool grey, large type. */
:root{
  --bg:#EEF1F0; --surface:#FFFFFF; --ink:#1B2A2F; --muted:#51616A; --line:#DDE3E1;
  --accent:#17595A; --accent-ink:#FFFFFF; --accent-soft:#D9EBE9; --accent-soft-ink:#0F4546;
  --warn-soft:#FBE9CF; --warn-ink:#6B3500;
  --font:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid #2F7FD0;outline-offset:2px}
h1,h2,h3,p{margin:0;text-wrap:balance}
.app{max-width:440px;margin:0 auto;min-height:100vh;background:var(--bg);padding-bottom:110px;position:relative}
.pad{padding:0 16px}
.top{display:flex;align-items:center;gap:8px;padding:18px 8px 6px}
.top .t{flex:1;font-weight:700;font-size:18px}
.iconbtn{width:48px;height:48px;border-radius:24px;border:0;background:transparent;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.iconbtn.solid{background:var(--accent);color:var(--accent-ink)}
.iconbtn.line{background:var(--surface);border:1px solid var(--line)}
.textbtn{min-height:44px;padding:0 12px;border:0;background:none;color:var(--accent);font-weight:700}
h1.big{font-size:28px;line-height:1.15;font-weight:700}
.sub{color:var(--muted);font-size:15px}
.sec{font-size:17px;font-weight:700;margin:24px 16px 10px;display:flex;justify-content:space-between;align-items:baseline}
.sec .textbtn{min-height:32px;padding:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:0 16px}
.card.pad16{padding:16px}
.hero{background:var(--accent);color:#fff;border-radius:20px;margin:12px 16px 0;padding:18px}
.hero .eyebrow{font-size:12px;letter-spacing:.08em;font-weight:700;color:#CDE3E0}
.hero .big2{font-size:22px;font-weight:700;margin-top:6px}
.hero .line2{color:#E3F0EE;font-size:16px}
.btnrow{display:flex;gap:10px;margin-top:14px}
.btn{min-height:52px;border-radius:14px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.onhero{background:#fff;color:var(--accent);border-color:#fff}
.btn.ghosthero{border-color:#CDE3E0;color:#fff}
.btn.block{width:100%}
.btn.flex1{flex:1}
.btn.danger{border-color:#8A3B12;color:#8A3B12}
.row{width:100%;display:flex;align-items:center;gap:12px;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 14px;min-height:60px}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .name{font-weight:700}
.row .meta{color:var(--muted);font-size:14px}
.avatar{width:44px;height:44px;border-radius:22px;background:var(--accent-soft);color:var(--accent-soft-ink);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.avatar.lg{width:64px;height:64px;border-radius:32px;font-size:22px}
.chip{display:inline-block;border-radius:20px;padding:4px 10px;font-size:13px;font-weight:700;background:var(--accent-soft);color:var(--accent-soft-ink)}
.chip.warn{background:var(--warn-soft);color:var(--warn-ink)}
.chip.plain{background:#E6EAE8;color:#334047}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.fchip{min-height:44px;border-radius:22px;padding:0 16px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;color:var(--ink)}
.fchip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.seg{display:flex;background:#DFE5E3;border-radius:14px;padding:4px;margin:12px 16px 0}
.seg button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;font-weight:700;color:#3F4D55}
.seg button.on{background:#fff;color:var(--ink)}
.date{width:54px;flex:none;text-align:center;line-height:1.1}
.date b{display:block;font-size:20px}
.date .yr{display:block;margin-top:1px;font-size:11px;letter-spacing:0}
.date span{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kind{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tl-month{margin:20px 20px 8px;font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.attn{width:calc(100% - 32px);margin:0 16px 8px;display:block;text-align:left;border:0;border-radius:14px;background:var(--warn-soft);color:var(--warn-ink);padding:14px 16px;font-weight:700;min-height:52px}
.attn small{display:block;font-weight:400;font-size:14px}
.note{white-space:pre-wrap}
.lbl{font-size:12px;font-weight:700;letter-spacing:.07em;color:var(--muted);text-transform:uppercase}
.meter{height:8px;border-radius:4px;background:#E3E8E6;overflow:hidden;margin-top:10px}
.meter i{display:block;height:100%;background:var(--accent)}
.meter.low i{background:#B5600F}
.check{display:flex;align-items:center;gap:12px;width:100%;min-height:52px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;padding:0 14px}
.box{width:26px;height:26px;border-radius:7px;border:2px solid var(--accent);flex:none;display:flex;align-items:center;justify-content:center;color:#fff}
.box.on{background:var(--accent)}
.check.done span.tx{text-decoration:line-through;color:var(--muted)}
.inline{display:flex;gap:8px;padding:10px 14px}
.inline input{flex:1}
input,select,textarea{width:100%;min-height:48px;border:1.5px solid #B9C4C1;border-radius:12px;background:#fff;padding:10px 12px;font-family:inherit;font-size:16px;color:var(--ink)}
textarea{min-height:90px;resize:vertical}
label.f{display:block;margin-top:14px;font-weight:700;font-size:15px}
label.f small{display:block;font-weight:400;color:var(--muted);font-size:13px}
.fieldbox{margin-top:6px}
.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(440px,100%);height:76px;background:#fff;border-top:1px solid var(--line);display:flex;align-items:center;padding:0 6px;z-index:5}
.tabbar button.tab{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;color:var(--muted);font-size:12px;font-weight:700}
.tabbar button.tab.on{color:var(--accent)}
.logbtn{width:60px;height:60px;border-radius:30px;border:0;background:var(--accent);color:#fff;margin:0 6px;transform:translateY(-14px);box-shadow:0 6px 16px rgba(23,89,90,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700;gap:0;flex:none}
.scrim{position:fixed;inset:0;background:rgba(27,42,47,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:min(440px,100%);max-height:92vh;overflow-y:auto;background:#fff;border-radius:22px 22px 0 0;padding:8px 18px 24px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:#CBD3D0;margin:6px auto 10px}
.sheet h2{font-size:20px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1B2A2F;color:#fff;padding:12px 18px;border-radius:12px;z-index:20;font-weight:700;max-width:90%}
.proto{margin:14px 16px 0;font-size:13px;color:var(--muted)}
.link{color:var(--accent);font-weight:700;background:none;border:0;padding:0;text-decoration:underline;text-underline-offset:3px}
.actions3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin-top:14px}
.act{min-height:60px;border-radius:14px;border:1px solid var(--line);background:#F4F7F6;color:var(--accent);font-weight:700;font-size:14px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;text-align:center;padding:4px}
.cond-last{font-size:14px;color:var(--muted);margin-top:4px}
.empty{padding:18px;color:var(--muted)}
.appbar{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px 12px 6px 18px}
.appbar .brand{font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--muted)}
.menuscrim{position:fixed;inset:0;background:rgba(27,42,47,.35);z-index:10;display:flex;justify-content:center;align-items:flex-start}
.menuwrap{width:min(440px,100%);display:flex;justify-content:flex-end;padding:64px 12px 0;pointer-events:none}
.menupanel{pointer-events:auto;width:290px;background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;box-shadow:0 12px 30px rgba(27,42,47,.25)}
.menupanel button,.menupanel a{box-sizing:border-box;color:var(--ink);text-decoration:none;font-size:16px;cursor:pointer;width:100%;min-height:58px;display:flex;align-items:center;gap:12px;padding:0 16px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;font-weight:700}
.menupanel>:last-child{border-bottom:0}
.menupanel .chip{margin-left:auto}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:12px 16px 0}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.tnum{font-size:26px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}
.pnbox{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--accent-soft);border-radius:14px;padding:12px 14px;margin-bottom:12px}
.pnum{font-size:24px;font-weight:700;color:var(--accent-soft-ink);font-variant-numeric:tabular-nums;letter-spacing:.02em}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.kv:last-child{border-bottom:0}
.kv span:first-child{color:var(--muted)}
.kv b{text-align:right}
.urltext{font-size:13px;color:var(--muted);word-break:break-all;margin-top:6px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
.ver{font-size:12px;font-weight:600;opacity:.65;margin-left:6px;letter-spacing:.02em}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<div id="menu"></div>
<div id="toast"></div>

<script>
(function(){
"use strict";
var DAY=864e5, KEY="mymedical-data-v1";
var MON=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
var MONL=["January","February","March","April","May","June","July","August","September","October","November","December"];
var DOW=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
var KINDS={visit:"Visit",call:"Phone call",result:"Results",test:"Test or scan",collected:"Medicine collected",note:"Note",appointment:"Appointment"};
var DTYPES=["GP","Cardiologist","Gastroenterologist","Urologist","Dermatologist","Respiratory","Surgeon","Dentist","Eyes","Other"];
var PKINDS=["Hospital","Clinic","Dental","Optician","Pharmacy","Other"];
var STATUS=["Ongoing","Monitoring","Resolved"];
var INS={none:"Not claimed",submitted:"Submitted",paid:"Paid out",rejected:"Rejected"};

var ICON={
 search:'<circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/>',
 clip:'<path d="M21 12.5l-8.6 8.6a5 5 0 0 1-7.1-7.1l9-9a3.3 3.3 0 0 1 4.7 4.7l-9 9a1.7 1.7 0 0 1-2.4-2.4l8.3-8.3"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
 down:'<path d="M12 4v11M7 11l5 5 5-5M5 20h14"/>',
 menu:'<path d="M4 7h16M4 12h16M4 17h16"/>',
 bill:'<path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',
 home:'<path d="M3 11l9-8 9 8M5 10v10h14V10"/>',
 people:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
 pill:'<path d="M10.5 20.5a5 5 0 0 1-7-7l10-10a5 5 0 0 1 7 7z"/><path d="M8.5 8.5l7 7"/>',
 file:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 back:'<path d="M15 5l-7 7 7 7"/>',
 chev:'<path d="M9 5l7 7-7 7"/>',
 phone:'<path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/>',
 pin:'<path d="M12 21s7-6.2 7-11a7 7 0 0 0-14 0c0 4.8 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/>',
 mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
 ext:'<path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/>',
 check:'<path d="M5 12l5 5 9-10"/>',
 copy:'<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h8"/>'
};
function ic(n,s){s=s||22;return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[n]+'</svg>';}

/* ---------- helpers ---------- */
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var uidn=0;function uid(p){uidn++;return p+Date.now().toString(36)+uidn;}
function sod(ts){var d=new Date(ts);d.setHours(0,0,0,0);return d.getTime();}
function pad(n){return (n<10?"0":"")+n;}
function dFull(ts){if(!ts)return "No date";var d=new Date(ts);return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear();}
function dMon(ts){var d=new Date(ts);return MONL[d.getMonth()]+" "+d.getFullYear();}
function tm(ts){var d=new Date(ts);if(d.getMilliseconds()===1)return "";return pad(d.getHours())+":"+pad(d.getMinutes());}
function dStamp(ts){var d=new Date(ts);return DOW[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear()+(tm(ts)?" · "+tm(ts):"");}
function dLong(ts){var d=new Date(ts);return DOW[d.getDay()]+" "+d.getDate()+" "+MONL[d.getMonth()]+" "+d.getFullYear()+(tm(ts)?", "+tm(ts):"");}
function relDays(n){
  if(n===0)return "today"; if(n===1)return "yesterday"; if(n===-1)return "tomorrow";
  var a=Math.abs(n), s;
  if(a<60)s=a+" days"; else if(a<700)s=Math.round(a/30.4)+" months"; else s=(Math.round(a/36.5)/10)+" years";
  return n>0?s+" ago":"in "+s;
}
function rel(ts){return relDays(Math.round((sod(Date.now())-sod(ts))/DAY));}
function toLocalInput(ts){var d=new Date(ts);return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes());}
function toDateInput(ts){return toLocalInput(ts).slice(0,10);}
function fromDateInput(s){return s?new Date(s+"T12:00").getTime():null;}
function fromLocalInput(s){return s?new Date(s).getTime():Date.now();}
function initials(n){var p=String(n).replace(/^(Dr\.?|Ms\.?|Mr\.?|Mrs\.?)\s+/i,"").split(/\s+/);return ((p[0]||"")[0]||"")+((p[1]||"")[0]||"");}
function nowTs(){return Date.now();}
function eur(n){return "€"+(Math.round((n||0)*100)/100).toFixed(2);}
function safeUrl(u){u=String(u||"").trim();if(!u)return "";if(!/^https?:\/\//i.test(u))u="https://"+u;try{new URL(u);return u;}catch(e){return "";}}

function tomorrow9(){var d=new Date();d.setDate(d.getDate()+1);d.setHours(9,0,0,0);return d.getTime();}

/* ---------- data ---------- */
var DATA={"allergies":"","places":[],"doctors":[],"conds":[],"meds":[],"events":[],"bills":[],"insurance":{"insurer":"","policyNumber":"","phone":"","url":"","notes":""}};
function mkTs(d,t){var p=d.split("-"),h=12,m=0,ms=1;if(t){var q=t.split(":");h=+q[0];m=+q[1];ms=0;}return new Date(+p[0],+p[1]-1,+p[2],h,m,0,ms).getTime();}
function seed(){
  var D=JSON.parse(JSON.stringify(DATA));
  D.events.forEach(function(e){e.ts=mkTs(e.d,e.t);delete e.d;delete e.t;});
  D.conds.forEach(function(c){c.since=mkTs(c.since,null);});
  D.bills.forEach(function(b){b.ts=b.d?mkTs(b.d,null):0;delete b.d;});
  seedExtras(D);
  return D;
}
function seedExtras(D){
  if(!D.insurance)D.insurance={insurer:"",policyNumber:"",phone:"",url:"",notes:""};
  if(!D.bills)D.bills=[];
  if(!D.chases)D.chases=[];
  if(D.healthFolder===undefined)D.healthFolder="";
  if(!D.driveFiles)D.driveFiles=[];
  if(!D.google)D.google={clientId:"",apiKey:""};
  if(D.allergies===undefined)D.allergies="";
  D.places.forEach(function(p){if(p.patientNumber===undefined)p.patientNumber="";});
}
var D;
function load(){try{var s=localStorage.getItem(KEY);if(s){var o=JSON.parse(s);if(o&&o.events){seedExtras(o);return o;}}}catch(e){}return seed();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(D));}catch(e){}}
D=load();

function by(list,id){for(var i=0;i<list.length;i++)if(list[i].id===id)return list[i];return null;}
function doc(id){return by(D.doctors,id);} function pl(id){return by(D.places,id);}
function cond(id){return by(D.conds,id);} function med(id){return by(D.meds,id);} function evt(id){return by(D.events,id);}
function sortDesc(a,b){return b.ts-a.ts;}
function pastEvents(f){var n=Date.now();return D.events.filter(function(e){return e.kind!=="appointment"&&e.ts<=n&&(!f||f(e));}).sort(sortDesc);}
function upcoming(f){var n=Date.now();return D.events.filter(function(e){return e.kind==="appointment"&&e.ts>=n&&(!f||f(e));}).sort(function(a,b){return a.ts-b.ts;});}
function unconfirmed(){var n=Date.now();return D.events.filter(function(e){return e.kind==="appointment"&&e.ts<n;}).sort(sortDesc);}
function lastVisit(did){return pastEvents(function(e){return e.doctorId===did&&e.kind==="visit";})[0]||null;}
function medLeft(m){if(!m.lastCollected||!m.supplyDays)return {out:null,days:9999,frac:1,unknown:true};var out=m.lastCollected+m.supplyDays*DAY;return {out:out,days:Math.ceil((out-Date.now())/DAY),frac:Math.max(0,Math.min(1,(out-Date.now())/(m.supplyDays*DAY)))};}
function who(e){var d=doc(e.doctorId),p=pl(e.placeId),a=[];if(d)a.push(d.name);if(p)a.push(p.name);return a.join(" · ");}

/* ---------- state ---------- */
var S={tab:"home",stack:[],sheet:null,seg:{people:"doctors",record:"summary"},dfilter:"All",tfilter:"all",confirm:null,bfilter:"action",cfilter:"open",hcond:"all",hfiles:"all",menu:false};
var $app=document.getElementById("app"),$layer=document.getElementById("layer"),$toast=document.getElementById("toast");
var toastTimer;
function toast(t){$toast.innerHTML='<div class="toast" role="status">'+esc(t)+'</div>';clearTimeout(toastTimer);toastTimer=setTimeout(function(){$toast.innerHTML="";},2600);}

/* ---------- view pieces ---------- */
function top(title,right){
  return '<div class="top"><button class="iconbtn" data-act="back" aria-label="Back">'+ic("back",24)+'</button><div class="t">'+esc(title)+'</div>'+(right||'<span style="width:48px"></span>')+'</div>';
}
function evRow(e){
  var d=new Date(e.ts);
  return '<button class="row" data-act="open" data-v="event" data-id="'+e.id+'">'+
    '<span class="date"><b>'+d.getDate()+'</b><span>'+MON[d.getMonth()]+'</span><span class="yr">'+d.getFullYear()+'</span></span>'+

function attention(){
  var out='';
  D.meds.filter(function(m){return m.active;}).map(function(m){return {m:m,l:medLeft(m)};}).filter(function(x){return x.l.days<=7;}).sort(function(a,b){return a.l.days-b.l.days;}).forEach(function(x){
    out+='<button class="attn" data-act="open" data-v="med" data-id="'+x.m.id+'">'+esc(x.m.name)+' '+(x.l.days<0?'ran out '+relDays(-x.l.days).replace("in ","")+' ago':x.l.days===0?'runs out today':'runs out in '+x.l.days+' day'+(x.l.days===1?'':'s'))+'<small>Last collected '+rel(x.m.lastCollected)+'. Tap to update.</small></button>';
  });
  D.doctors.filter(function(d){return d.type==="Dentist"||d.type==="Eyes";}).forEach(function(d){
    var lv=lastVisit(d.id);
    if(lv&&Date.now()-lv.ts>365*DAY&&!upcoming(function(e){return e.doctorId===d.id;}).length)
      out+='<button class="attn" data-act="open" data-v="doctor" data-id="'+d.id+'">'+esc(d.type)+' check-up is due<small>Last seen '+rel(lv.ts)+' ('+esc(d.name)+')</small></button>';
  });
  unconfirmed().forEach(function(e){
    out+='<button class="attn" data-act="open" data-v="event" data-id="'+e.id+'">Did this appointment happen?<small>'+esc(e.title)+' · '+dStamp(e.ts)+'</small></button>';
  });
  var nrc=D.events.filter(function(e){return e.notRecorded;}).length;
  if(nrc)out+='<button class="attn" data-act="to-record">'+nrc+' entr'+(nrc===1?'y is':'ies are')+' not recorded yet<small>Marked as not done in your spreadsheet. Tap to review.</small></button>';
  var nck=D.bills.filter(function(b){return b.paid===null;}).length;
  if(nck)out+='<button class="attn" data-act="to-check">'+nck+' bill'+(nck===1?' has':'s have')+' no paid status<small>Your spreadsheet left Paid blank. Tap to check them.</small></button>';
  D.bills.filter(billOverdue).sort(function(a,b){return a.dueTs-b.dueTs;}).forEach(function(b){
    out+='<button class="attn" data-act="open" data-v="bill" data-id="'+b.id+'">Bill overdue: '+esc(b.provider)+' '+eur(b.amount)+'<small>Was due '+rel(b.dueTs)+'. Tap to pay or update.</small></button>';
  });
  D.bills.filter(function(b){var d=Math.round((sod(b.dueTs)-sod(Date.now()))/DAY);return b.paid===false&&b.dueTs&&d>=0&&d<=7;}).forEach(function(b){
    out+='<button class="attn" data-act="open" data-v="bill" data-id="'+b.id+'">Bill due soon: '+esc(b.provider)+' '+eur(b.amount)+'<small>Due '+relDays(Math.round((sod(Date.now())-sod(b.dueTs))/DAY))+'.</small></button>';
  });
  return out;
}

function runText(m,l){return l.days<0?"Ran out "+relDays(-l.days).replace(" ago","")+" ago":l.days===0?"Runs out today":"Runs out in "+l.days+" day"+(l.days===1?"":"s");}
function medRow(m){
  var l=medLeft(m), low=!l.unknown&&l.days<=7, line;
  if(!m.active)line="Last collected "+(m.lastCollected?dFull(m.lastCollected):"not recorded");

  else line=runText(m,l)+" (about "+dFull(l.out)+")";
  return '<button class="row" data-act="open" data-v="med" data-id="'+m.id+'"><span class="grow"><span class="name" style="display:block">'+esc(m.name)+' '+esc(m.dose)+'</span><span class="meta">'+esc(m.schedule)+'</span><span class="meta" style="display:block">'+line+'</span></span>'+(m.active&&low?'<span class="chip warn">Low</span>':'')+'<span style="color:var(--muted)">'+ic("chev",18)+'</span></button>';
}

      }else{

var FKINDS={visit:["visit","visits"],test:["test or scan","tests and scans"],call:["call","calls"],result:["result","results"],note:["letter or note","letters and notes"],appointment:["appointment","appointments"]};
function fileClass(f){return /Results - Letters/.test(f.p||"")?"result":"appt";}
function hasClass(e,k){return (e.files||[]).some(function(f){return fileClass(f)===k;});}
function histEntries(){
  var hc=S.hcond||"all",hf=S.hfiles||"all",n=Date.now();
  return D.events.filter(function(e){
    if(e.ts>n||e.kind==="collected")return false;

    if(hf!=="all"&&!hasClass(e,hf))return false;

}

}

/* ---------- BILLS & INSURANCE ---------- */
function bill(id){return by(D.bills,id);}
function billsFor(e){return D.bills.filter(function(b){return b.eventId===e.id;});}
function billOverdue(b){return b.paid===false&&b.dueTs&&sod(b.dueTs)<sod(Date.now());}
function needBills(){return D.bills.filter(function(b){return b.paid===false||b.insStatus==="submitted";});}
function billTotals(){
  var t={owe:0,unpaid:0,back:0,wait:0};
  D.bills.forEach(function(b){if(b.paid===false){t.owe+=b.amount;t.unpaid++;}if(b.insStatus==="submitted"){t.back+=(b.insCovered||0);t.wait++;}});
  return t;
}
function provName(pid,did){var p=pl(pid),d=doc(did);return p?p.name:(d?d.name:"");}
function paidChip(b){return b.paid===null?'<span class="chip plain">Paid? Not recorded</span>':(b.paid?'<span class="chip">Paid</span>':(billOverdue(b)?'<span class="chip warn">Overdue</span>':'<span class="chip plain">Unpaid</span>'));}
function insChip(b){var s=b.insStatus||"none";return '<span class="chip '+(s==="rejected"?"warn":s==="none"?"plain":"")+'">Insurance: '+INS[s].toLowerCase()+'</span>';}
function billRow(b){
  return '<button class="row" data-act="open" data-v="bill" data-id="'+b.id+'" style="align-items:flex-start"><span class="grow"><span class="name" style="display:block">'+esc(b.provider||"Bill")+'</span><span class="meta">'+dFull(b.ts)+(b.dueTs&&b.paid===false?' · due '+dFull(b.dueTs):'')+'</span><span style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'+paidChip(b)+insChip(b)+'</span></span><span style="font-weight:700;font-variant-numeric:tabular-nums">'+eur(b.amount)+'</span></button>';
}
function billLinks(e){
  return billsFor(e).map(function(b){return '<button class="row" data-act="open" data-v="bill" data-id="'+b.id+'"><span class="avatar">'+ic("bill",20)+'</span><span class="grow"><span class="meta">Bill</span><span class="name" style="display:block">'+esc(b.provider)+' · '+eur(b.amount)+'</span></span></button>';}).join("");
}
function vBills(){
  var t=billTotals(),f=S.bfilter||"action";
  var out=top("Bills",'<button class="iconbtn solid" data-act="add-bill" aria-label="Add bill">'+ic("plus",24)+'</button>');
  out+='<div class="tiles"><div class="tile"><div class="lbl">You owe</div><div class="tnum">'+eur(t.owe)+'</div><div class="sub">'+t.unpaid+' unpaid bill'+(t.unpaid===1?"":"s")+'</div></div><div class="tile"><div class="lbl">Insurance owes you</div><div class="tnum">'+eur(t.back)+'</div><div class="sub">'+t.wait+' claim'+(t.wait===1?"":"s")+' waiting</div></div></div>';
  out+='<div class="pad chips" style="margin-top:14px">'+[["action","Needs action"],["check","To check"],["paid","Paid"],["all","All"]].map(function(x){return '<button class="fchip '+(f===x[0]?"on":"")+'" data-act="bfilter" data-v="'+x[0]+'">'+x[1]+'</button>';}).join("")+'</div><div style="height:12px"></div>';
  var list=D.bills.filter(function(b){return f==="all"||(f==="paid"?b.paid===true:(f==="check"?b.paid===null:(b.paid===false||b.insStatus==="submitted")));});
  list.sort(function(a,b){
    if(f==="paid"||f==="all"||f==="check")return b.ts-a.ts;
    var ao=billOverdue(a)?0:1,bo=billOverdue(b)?0:1;

  });
  out+=listCard(list.map(billRow).join("")||'<div class="empty">Nothing here. Tap + to add a bill.</div>');
  out+='<div class="pad" style="margin-top:16px"><button class="btn block" data-act="menu-go" data-v="insurance">'+ic("shield",20)+' Insurance details</button></div>';
  return out;
}

    out+='<div class="sec"><span>This bill is for</span></div><div class="card" style="overflow:hidden">'+(e?evRow(e):'')+
      (d?'<button class="row" data-act="open" data-v="doctor" data-id="'+d.id+'"><span class="avatar">'+esc(initials(d.name))+'</span><span class="grow"><span class="meta">Doctor</span><span class="name" style="display:block">'+esc(d.name)+'</span></span></button>':'')+
      (p?'<button class="row" data-act="open" data-v="place" data-id="'+p.id+'"><span class="avatar">'+ic("pin",20)+'</span><span class="grow"><span class="meta">Where</span><span class="name" style="display:block">'+esc(p.name)+'</span></span></button>':'')+'</div>';

  return out;

}

function chase(id){return by(D.chases||[],id);}
function openChases(){return (D.chases||[]).filter(function(c){return !c.resolved;}).sort(function(a,b){return b.startedTs-a.startedTs;});}

  var calls=chaseCalls(c),n=calls.length,last=calls[0],d=doc(c.doctorId),cd=cond(c.condId);

   case "hist-copy":histCopy();break;
   case "paste-link":
     var pk=el.getAttribute("data-key"),pin=document.getElementById("f_"+pk);
     try{navigator.clipboard.readText().then(function(tx){tx=String(tx||"").trim();if(/^https?:\/\//i.test(tx)){if(pin)pin.value=tx;toast("Link pasted");}else toast("No link found. Copy the file link in Drive first.");},function(){toast("Could not read the clipboard. Paste into the box instead.");if(pin)pin.focus();});}
     catch(x){toast("Could not read the clipboard. Paste into the box instead.");if(pin)pin.focus();}break;
   case "drive-pick":drivePick(el.getAttribute("data-key"));break;
   case "edit-google":editGoogle();break;
   case "cfilter":S.cfilter=el.getAttribute("data-v");render();break;
   case "edit-folder":editFolder();break;
   case "add-chase":case "edit-chase":
     var cc2=a==="edit-chase"?chase(id):null;
     openSheet({title:cc2?"Edit chase-up":"New chase-up",intro:cc2?"":"For a scan, result or letter you are waiting on. Calls you log can be attached to it.",fields:chaseFields(),values:cc2?JSON.parse(JSON.stringify(cc2)):{title:"",condId:"",doctorId:"",notes:""},saveLabel:cc2?"Save":"Start chase-up",
       save:function(x){if(!x.title.trim()){toast("Say what you are chasing first");return false;}
         if(cc2){Object.keys(x).forEach(function(k){cc2[k]=x[k];});}else{x.id=uid("ch");x.startedTs=Date.now();x.resolved=false;x.resolvedTs=null;x.outcome="";D.chases.push(x);}
         save();closeSheet();toast("Chase-up saved");if(!cc2){S.stack=[];go("chase",x.id);}else render();}});break;
   case "resolve-chase":
     var rc=chase(id);
     openSheet({title:"Mark as resolved",intro:rc.title,fields:[{key:"outcome",label:"What was the answer?",type:"textarea",ph:"Optional. E.g. results are normal, appointment booked"}],values:{outcome:rc.outcome||""},saveLabel:"Mark as resolved",
       save:function(x){rc.resolved=true;rc.resolvedTs=Date.now();rc.outcome=x.outcome;save();closeSheet();toast("Chase-up resolved");render();}});break;
   case "reopen-chase":var oc3=chase(id);oc3.resolved=false;oc3.resolvedTs=null;save();toast("Chase-up reopened");render();break;
   case "del-chase":
     if(S.confirm===id){D.events.forEach(function(e){if(e.chaseId===id)e.chaseId="";});var ci=D.chases.findIndex(function(c){return c.id===id;});D.chases.splice(ci,1);S.confirm=null;S.stack.pop();save();toast("Chase-up deleted");render(true);}
     else{S.confirm=id;render();}break;
   case "to-check":S.bfilter="check";S.stack=[];S.confirm=null;go("bills",null);break;
   case "attended":var e=evt(id);e.kind="visit";save();toast("Marked as a visit");render();break;
   case "collected":markCollected(id);break;
   case "raise-toggle":var d=doc(id),r=d.raise[+el.getAttribute("data-i")];r.done=!r.done;save();render();break;
   case "raise-add":var inp=document.getElementById("raiseInput");if(inp&&inp.value.trim()){doc(id).raise.push({t:inp.value.trim(),done:false});save();render();}break;
   case "reset":try{localStorage.removeItem(KEY);}catch(x){}D=seed();S.stack=[];S.tab="home";render(true);toast("Spreadsheet data reloaded");break;
   case "copy-summary":
     try{navigator.clipboard.writeText(summaryText()).then(function(){toast("Summary copied");},function(){showCopy();});}catch(x){showCopy();}break;
   case "add-doctor":
     openSheet({title:"Add a doctor",fields:[{key:"name",label:"Name",type:"text",ph:"e.g. Dr. Jane Murphy"},{key:"type",label:"Type of doctor",type:"select",options:strOpts(DTYPES)},{key:"placeId",label:"Hospital or place",type:"select",options:placeOpts()},{key:"phone",label:"Phone",type:"tel"},{key:"email",label:"Email",type:"email"}],values:{name:"",type:"GP",placeId:"",phone:"",email:""},
       save:function(x){if(!x.name.trim()){toast("Add a name first");return false;}x.id=uid("d");x.notes="";x.raise=[];D.doctors.push(x);save();closeSheet();toast("Doctor added");render();}});break;
   case "edit-doctor":
     var dd=doc(id);openSheet({title:"Edit doctor",fields:[{key:"name",label:"Name",type:"text"},{key:"type",label:"Type of doctor",type:"select",options:strOpts(DTYPES)},{key:"placeId",label:"Hospital or place",type:"select",options:placeOpts()},{key:"phone",label:"Phone",type:"tel"},{key:"email",label:"Email",type:"email"},{key:"notes",label:"Notes",type:"text"}],values:JSON.parse(JSON.stringify(dd)),
       save:function(x){Object.keys(x).forEach(function(k){dd[k]=x[k];});save();closeSheet();render();}});break;
   case "add-place":
     openSheet({title:"Add a hospital or place",fields:[{key:"name",label:"Name",type:"text",ph:"e.g. St. Brendan's Hospital"},{key:"kind",label:"Kind of place",type:"select",options:strOpts(PKINDS)},{key:"address",label:"Address",type:"text"},{key:"patientNumber",label:"Patient number",type:"text",hint:"The number this place gave you. Shown at the top of its page."},{key:"phone",label:"Phone",type:"tel"}],values:{name:"",kind:"Hospital",address:"",patientNumber:"",phone:""},
       save:function(x){if(!x.name.trim()){toast("Add a name first");return false;}x.id=uid("p");D.places.push(x);save();closeSheet();toast("Place added");render();}});break;
   case "edit-place":
     var pp=pl(id);openSheet({title:"Edit place",fields:[{key:"name",label:"Name",type:"text"},{key:"kind",label:"Kind of place",type:"select",options:strOpts(PKINDS)},{key:"address",label:"Address",type:"text"},{key:"patientNumber",label:"Patient number",type:"text",hint:"The number this place gave you. Shown at the top of its page."},{key:"phone",label:"Phone",type:"tel"}],values:JSON.parse(JSON.stringify(pp)),
       save:function(x){Object.keys(x).forEach(function(k){pp[k]=x[k];});save();closeSheet();render();}});break;
   case "add-med":case "edit-med":
     var mm=a==="edit-med"?med(id):null;
     var mv=mm?JSON.parse(JSON.stringify(mm)):{name:"",dose:"",schedule:"",doctorId:"",condId:"",placeId:"p5",lastCollected:Date.now(),supplyDays:30,active:true};
     var mf=[{key:"name",label:"Medicine",type:"text",ph:"e.g. Ramipril"},{key:"dose",label:"Dose",type:"text",ph:"e.g. 5 mg"},{key:"schedule",label:"When you take it",type:"text",ph:"e.g. Once a day, morning"},
       {key:"lastCollected",label:"Last collected",type:"date"},{key:"supplyDays",label:"Days the supply lasts",type:"number",hint:"Used to work out when you will run out."},
       {key:"doctorId",label:"Prescribed by",type:"select",options:docOpts()},{key:"placeId",label:"Collected from",type:"select",options:placeOpts()},{key:"condId",label:"For",type:"select",options:condOpts()},
       {key:"active",label:"Status",type:"select",options:[{v:"true",l:"Current"},{v:"false",l:"Stopped"}]},{key:"notes",label:"Notes",type:"text"}];
     mv.active=String(mv.active!==false);
     openSheet({title:mm?"Edit medicine":"Add a medicine",fields:mf,values:mv,
       save:function(x){if(!x.name.trim()){toast("Add a name first");return false;}x.active=(x.active==="true");if(mm){Object.keys(x).forEach(function(k){mm[k]=x[k];});}else{x.id=uid("m");D.meds.push(x);}save();closeSheet();toast("Saved");render();}});break;
   case "add-cond":case "edit-cond":
     var cc=a==="edit-cond"?cond(id):null;
     openSheet({title:cc?"Edit health issue":"Add a health issue",fields:[{key:"name",label:"What is it?",type:"text",ph:"e.g. Left knee pain"},{key:"status",label:"Status",type:"select",options:strOpts(STATUS)},{key:"since",label:"Since",type:"date"},{key:"notes",label:"Notes",type:"textarea"}],
       values:cc?JSON.parse(JSON.stringify(cc)):{name:"",status:"Ongoing",since:Date.now(),notes:""},
       save:function(x){if(!x.name.trim()){toast("Add a name first");return false;}if(cc){Object.keys(x).forEach(function(k){cc[k]=x[k];});}else{x.id=uid("c");D.conds.push(x);}save();closeSheet();toast("Saved");render();}});break;
   case "menu-open":S.menu=true;renderMenu();var mb=document.querySelector("#menu button");if(mb)mb.focus();break;
   case "menu-close":S.menu=false;renderMenu();break;
   case "menu-go":S.menu=false;renderMenu();S.stack=[];S.confirm=null;go(el.getAttribute("data-v"),null);break;
   case "copy":copyText(el.getAttribute("data-text"));break;
   case "bfilter":S.bfilter=el.getAttribute("data-v");render();break;
   case "add-bill":case "edit-bill":
     var bb=a==="edit-bill"?bill(id):null,bpre=el.getAttribute("data-event")||"";
     var bv=bb?JSON.parse(JSON.stringify(bb)):{eventId:bpre,doctorId:"",placeId:"",provider:"",ts:Date.now(),dueTs:Date.now()+30*DAY,amount:0,invoiceUrl:"",paid:false,paidTs:null,payRef:"",insStatus:"none",insCovered:0,notes:""};
     if(!bb&&bpre)bv=billChange("eventId",bv);
     bv.paid=String(bv.paid);
     openSheet({title:bb?"Edit bill":"Add a bill",fields:billFields(),values:bv,onChange:billChange,
       save:function(x){
         if(!x.ts)x.ts=Date.now();
         x.paid=(x.paid==="true"?true:(x.paid==="null"?null:false));
         if(bb){var was=bb.paid;Object.keys(x).forEach(function(k){bb[k]=x[k];});if(bb.paid&&!was&&!bb.paidTs)bb.paidTs=Date.now();if(!bb.paid)bb.paidTs=null;}
         else{x.id=uid("b");x.paidTs=x.paid?Date.now():null;D.bills.push(x);}
         save();closeSheet();toast("Bill saved");
         if(!bb){S.stack=[];S.tab=S.tab||"home";go("bill",x.id);}else render();
       }});break;
   case "pay-bill":
     var pb=bill(id);
     openSheet({title:"Mark as paid",intro:pb.provider+" · "+eur(pb.amount),fields:[{key:"paidTs",label:"Paid on",type:"datetime",hint:"Stamped with the time right now. Change it if you paid earlier."},{key:"payRef",label:"Payment reference",type:"text",ph:"Receipt or transaction number"}],values:{paidTs:Date.now(),payRef:pb.payRef||""},saveLabel:"Mark as paid",
       save:function(x){pb.paid=true;pb.paidTs=x.paidTs;pb.payRef=x.payRef;save();closeSheet();toast("Marked as paid on "+dFull(x.paidTs));render();}});break;
   case "unpay-bill":var ub=bill(id);ub.paid=false;ub.paidTs=null;save();toast("Marked as unpaid");render();break;
   case "claim-bill":
     var cb=bill(id);
     openSheet({title:"Insurance claim",intro:cb.provider+" · "+eur(cb.amount),fields:[{key:"insStatus",label:"Claim status",type:"select",options:Object.keys(INS).map(function(k){return {v:k,l:INS[k]};})},{key:"insCovered",label:"Insurance covers (EUR)",type:"money",hint:"The amount insurance pays, or you expect them to pay."}],values:{insStatus:cb.insStatus||"none",insCovered:cb.insCovered||0},
       save:function(x){cb.insStatus=x.insStatus;cb.insCovered=x.insCovered;save();closeSheet();toast("Claim updated");render();}});break;
   case "del-bill":
     if(S.confirm===id){var bi=D.bills.findIndex(function(b){return b.id===id;});D.bills.splice(bi,1);S.confirm=null;S.stack.pop();save();toast("Bill deleted");render(true);}
     else{S.confirm=id;render();}break;
   case "edit-insurance":
     var ii=D.insurance;
     openSheet({title:"Insurance",fields:[{key:"insurer",label:"Insurer",type:"text",ph:"e.g. Your health insurer"},{key:"policyNumber",label:"Policy number",type:"text"},{key:"phone",label:"Phone",type:"tel"},{key:"url",label:"Insurer link",type:"url",ph:"Paste the link here",hint:"Becomes a button that opens their website."},{key:"notes",label:"Notes",type:"textarea"}],values:JSON.parse(JSON.stringify(ii)),
       save:function(x){Object.keys(x).forEach(function(k){ii[k]=x[k];});save();closeSheet();toast("Insurance saved");render();}});break;
   case "edit-allergies":
     openSheet({title:"Allergies",fields:[{key:"allergies",label:"Allergies",type:"text",ph:"e.g. Penicillin"}],values:{allergies:D.allergies},save:function(x){D.allergies=x.allergies;save();closeSheet();render();}});break;
  }
}
function showCopy(){
  openSheet({title:"Copy summary",intro:"Select all the text below and copy it.",fields:[{key:"txt",label:"Summary",type:"textarea"}],values:{txt:summaryText()},saveLabel:"Done",noFocus:true,save:function(){closeSheet();}});
  setTimeout(function(){var t=document.getElementById("f_txt");if(t){t.style.minHeight="260px";t.select();}},30);
}

document.addEventListener("click",function(ev){
  var el=ev.target.closest("[data-act]");
  if(!el)return;
  var a=el.getAttribute("data-act");
  if(a==="scrim"){if(ev.target===el)closeSheet();return;}
  if(a==="close-sheet"){closeSheet();return;}
  if(a==="chip"){
    var c=S.sheet,v=collect();v[el.getAttribute("data-key")]=el.getAttribute("data-val");
    c.values=c.onChange?c.onChange(el.getAttribute("data-key"),v):v;renderSheet();return;
  }
  if(a==="save-sheet"){
    var c2=S.sheet,x=collect();
    if(c2.save(x)===false)return;
    return;
  }
  if(a==="menu-close"&&ev.target!==el)return;
  doAct(el);
});
document.addEventListener("change",function(ev){
  var t=ev.target;
  if(t.id==="importFile"&&t.files&&t.files[0]){
    var r=new FileReader();
    r.onload=function(){handleImport(String(r.result||""));};
    r.onerror=function(){toast("Could not read that file.");};
    r.readAsText(t.files[0]);
    try{t.value="";}catch(e){}
    return;
  }
  if(S.sheet&&t.id&&/^f_.+_pick$/.test(t.id)&&t.tagName==="SELECT"){
    var bk=t.id.slice(2,-5),bv=collect();bv[bk]=t.value||bv[bk];S.sheet.values=S.sheet.onChange?S.sheet.onChange(bk,bv):bv;renderSheet();return;
  }
  if(S.sheet&&S.sheet.onChange&&t.id&&t.id.indexOf("f_")===0&&t.tagName==="SELECT"){
    var key=t.id.slice(2),v=collect();S.sheet.values=S.sheet.onChange(key,v);renderSheet();
  }
});
document.addEventListener("keydown",function(ev){
  if(ev.key==="Escape"){if(S.sheet)closeSheet();else if(S.menu){S.menu=false;renderMenu();}}
  if(ev.key==="Enter"&&ev.target.id==="raiseInput"){ev.preventDefault();doAct(document.querySelector('[data-act="raise-add"]'));}
});
render();
})();
</script>
